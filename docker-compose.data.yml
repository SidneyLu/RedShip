# RedShip 数据层 — 仅成品 Markdown 文献 + PG/Milvus embedding（无 MinerU）
#
# 文献来源：./bibliography/ 下仅 .md / .markdown（由 docker-compose.mineru.yml 产出或手工放置）
# 不包含：frontend、MinerU；backend 使用 Dockerfile.data 精简镜像
#
# ── 推荐流水线 ───────────────────────────────────────────────────────────────
#   A 机（可选）：docker compose -f docker-compose.mineru.yml run --rm mineru
#   B 机（建库）：
#     cp .env.example .env    # DASHSCOPE_API_KEY
#     # 成品 MD 已在 ./bibliography/
#     docker compose -f docker-compose.data.yml up -d --build
#     curl -X POST http://localhost:8005/api/admin/bibliography/reindex -H "Authorization: Bearer …"
#   导出：./scripts/export-data.sh -f docker-compose.data.yml
#   导入 App 开发机：./scripts/import-data.sh ./export/redship-… -f docker-compose.yml
#
name: redship-data

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-redship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redship}
      POSTGRES_DB: ${POSTGRES_DB:-redship}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redship} -d ${POSTGRES_DB:-redship}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: bitnami/etcd:3.5
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/bitnami/etcd

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.5.4
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "${MILVUS_PUBLISH_PORT:-19530}:19530"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.data
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MILVUS_HOST: milvus
      BIBLIOGRAPHY_MARKDOWN_ONLY: "true"
    volumes:
      - ./bibliography:/bibliography:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8005}:8005"
    command: >
      bash -c "alembic upgrade head &&
               uvicorn app.main:app --host 0.0.0.0 --port 8005"

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
