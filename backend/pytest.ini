[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: pure unit tests (no DB / network)
    integration: ASGI + Postgres test DB with mocked externals
    system: live Docker Compose HTTP smoke (localhost:8005)
filterwarnings =
    ignore::DeprecationWarning
